version: '3.8'

networks:
  smart-iot-network:
    driver: bridge

services:
  # MongoDB cho Rules Service
  mongodb-rules:
    image: mongo:7
    container_name: smart-iot-mongodb-rules
    ports:
      - "27020:27017"
    environment:
      - MONGO_INITDB_DATABASE=smart_iot_rules
    volumes:
      - mongodb_rules_data:/data/db
    networks:
      - smart-iot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Rules Service
  rules-service:
    build:
      context: ../services/rules-service
      dockerfile: Dockerfile
    container_name: smart-iot-rules-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb-rules:27017/smart_iot_rules
      - KAFKA_BROKERS=34.59.250.63:9092
      - ML_SERVICE_URL=http://ml-service:3007
      - ML_SUPPORT_ENABLED=true
      - ML_SUPPORT_THRESHOLD=0.8
      - ML_SUPPORT_TIMEOUT_MS=1500
      - JWT_SECRET=${JWT_SECRET:-your-strong-secret}
    extra_hosts:
      - "kafka:34.59.250.63"
    networks:
      - smart-iot-network
    depends_on:
      mongodb-rules:
        condition: service_healthy
      ml-service:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Alerts Service
  alerts-service:
    build:
      context: ../services/alerts-service
      dockerfile: Dockerfile
    container_name: smart-iot-alerts-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - NODE_ENV=production
      - MONGODB_URI=mongodb://34.59.250.63:27019/smart_iot_alerts
      - KAFKA_BROKERS=34.59.250.63:9092
      - JWT_SECRET=${JWT_SECRET:-your-strong-secret}
      - APP_URL=http://34.59.250.63:3000
      - ALLOWED_ORIGINS=http://34.59.250.63:3000,http://localhost:3000
      - LOG_LEVEL=info
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
      # Email (optional - set nếu có)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      # FCM (optional - set nếu có)
      - FCM_PROJECT_ID=${FCM_PROJECT_ID:-}
      - FCM_PRIVATE_KEY=${FCM_PRIVATE_KEY:-}
      - FCM_CLIENT_EMAIL=${FCM_CLIENT_EMAIL:-}
    extra_hosts:
      - "kafka:34.59.250.63"
    networks:
      - smart-iot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ML Service
  ml-service:
    build:
      context: ../services/ml-service
      dockerfile: Dockerfile
    container_name: smart-iot-ml-service
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
      - NODE_ENV=production
      - MONGODB_URI=mongodb://34.59.250.63:27021/smart_iot_ml
      - KAFKA_ENABLED=true
      - KAFKA_BROKERS=34.59.250.63:9092
      - KAFKA_GROUP_ID=ml-service-group
      - KAFKA_TOPICS=iot.telemetry.logs,iot.events.logs
      - MODEL_SAVE_DIR=./models
      - RETRAIN_INTERVAL_HOURS=24
      - PREDICTION_THRESHOLD=0.7
      - ANOMALY_THRESHOLD=0.85
      - FALSE_ALERT_THRESHOLD=0.3
      - ALERT_COOLDOWN_MINUTES=5
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://34.59.250.63:3000,http://localhost:3000}
    volumes:
      - ml_models:/app/models
    extra_hosts:
      - "kafka:34.59.250.63"
    networks:
      - smart-iot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3007/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mongodb_rules_data:
  ml_models:

