version: '3.8'

services:
  ml-service:
    build: .
    container_name: ml-service
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
      - NODE_ENV=development
      - MONGODB_URI=mongodb://host.docker.internal:27017/smart_iot
      - KAFKA_BROKERS=host.docker.internal:29092
      - MODEL_SAVE_DIR=./models
      - RETRAIN_INTERVAL_HOURS=24
      - PREDICTION_THRESHOLD=0.7
      - ANOMALY_THRESHOLD=0.85
      - FALSE_ALERT_THRESHOLD=0.3
      - ALERT_COOLDOWN_MINUTES=5
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001
    volumes:
      - ./models:/app/models
    networks:
      - smart-iot-network
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: ml-service-mongodb
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=smart_iot
    volumes:
      - mongodb_data:/data/db
    networks:
      - smart-iot-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  smart-iot-network:
    external: true

